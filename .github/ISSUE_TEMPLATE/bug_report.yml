name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pull request on bitbucket.org
        2. Click the extension icon
        3. ...
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: e.g. 0.0.2
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 142, Firefox 145
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Errors from the page or extension console, if any.
